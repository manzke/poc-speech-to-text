name: license-gate

# Enforces NFR-7 / ADR-009: every THIRD-PARTY component we ship must be
# permissive (Apache/MIT/BSD/PSF/ISC). This does NOT police our own repo license
# (AGPL-3.0, intentional) — it scans the installed dependency tree only.
#
# The translation ([translation], NLLB CC-BY-NC) and diarization ([diarization-*],
# gated pyannote) extras are deliberately NOT installed, so they can never enter
# the dependency set the default image ships (ADR-008 / ADR-010).

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pip-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install shipped dependencies (CPU extra only)
        run: |
          python -m pip install --upgrade pip
          # Same pin as the Dockerfile. CPU extra mirrors the arm64 dev build;
          # the CUDA extra adds NVIDIA CUDA runtime wheels (NVIDIA proprietary
          # EULA) which are allowlisted explicitly below.
          pip install "whisperlivekit[cpu]==0.2.22" ctranslate2 pip-licenses
      - name: Enforce permissive-only dependency licenses
        run: python scripts/check_licenses.py
