name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    name: python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - name: config + entrypoint tests
        run: |
          python -m pytest tests/test_config.py -q
          bash tests/test_entrypoint.sh

  web-sdk:
    name: web sdk build + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/web-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test

  helm:
    name: helm lint + template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint helm/stt
      - run: helm template stt helm/stt -f helm/stt/values-cpu.yaml >/dev/null
      - run: helm template stt helm/stt -f helm/stt/values-gpu.yaml --set ingress.enabled=true >/dev/null
