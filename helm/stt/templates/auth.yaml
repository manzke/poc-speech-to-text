{{- if .Values.auth.enabled -}}
{{- $fullName := include "stt.fullname" . -}}
{{- $authName := printf "%s-auth" $fullName -}}
{{- $img := .Values.auth.image -}}
{{- $repo := $img.repository | default .Values.image.repository -}}
{{- $tag := $img.tag | default .Values.image.tag -}}
{{- $secretName := .Values.auth.existingSecret | default $authName -}}
{{- if and .Values.auth.create (not .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $authName }}
  labels:
    {{- include "stt.labels" . | nindent 4 }}
type: Opaque
stringData:
  STT_AUTH_TOKEN: {{ .Values.auth.token | quote }}
  STT_AUTH_JWT_SECRET: {{ .Values.auth.jwtSecret | quote }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $authName }}
  labels:
    {{- include "stt.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth
spec:
  replicas: {{ .Values.auth.replicas }}
  selector:
    matchLabels:
      {{- include "stt.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: auth
  template:
    metadata:
      labels:
        {{- include "stt.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: auth
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: auth
          image: "{{ $repo }}:{{ $tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "uvicorn", "server.auth_gateway:app",
                    "--host", "0.0.0.0", "--port", "{{ .Values.auth.port }}"]
          ports:
            - name: http
              containerPort: {{ .Values.auth.port }}
          env:
            - name: STT_AUTH_MODE
              value: {{ .Values.auth.mode | quote }}
            {{- if .Values.auth.jwtAudience }}
            - name: STT_AUTH_JWT_AUDIENCE
              value: {{ .Values.auth.jwtAudience | quote }}
            {{- end }}
            {{- if .Values.auth.jwtIssuer }}
            - name: STT_AUTH_JWT_ISSUER
              value: {{ .Values.auth.jwtIssuer | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ $secretName }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.auth.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $authName }}
  labels:
    {{- include "stt.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.auth.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "stt.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: auth
{{- end }}
